# Promo scrape + odds refresh + profit snapshots, three times a day.
#
# Each scheduled run (15:37, 18:37 and 22:37 UTC, about 9:37 AM, 12:37 PM and
# 4:37 PM MDT) does the same work: scrape promos, then run one moneyline odds
# refresh and record profit snapshots (which feed the Statistics tab) and each
# member's own observations (member_profit_observations, which feed the
# Dashboard). Scheduled runs
# always pass --force so the Denver morning-window gate never skips them.
#
# Odds cost: each refresh spends about sports x region-groups x 1 credits (see
# src/ingestion/odds/quota.ts). Three runs a day is well above the 500-credit
# free-tier budget, so the in-app credit guard will block refreshes once the
# budget runs low. Lower the schedule or the sport list if that matters.
#
# Morning: GitHub often starts the 15:37 run hours late, so Vercel Cron also
# dispatches this workflow at 13:17 UTC (7:17 AM MDT) via /api/cron/scrape as
# a promo scrape only (skip_morning_observe=true; no extra odds spend).
#
# Manual dispatch is still available. force_morning_observe runs the odds step
# outside the morning window. skip_morning_observe skips the odds step.
#
# Installs no browser -- all target books are render_mode "http" (D-09), so
# the scrape step is a plain `npm ci` + one Node script writing straight to
# the shared Neon Postgres DB.
name: Scrape promos

on:
  schedule:
    - cron: "37 15 * * *"
    - cron: "37 18 * * *"
    - cron: "37 22 * * *"
  workflow_dispatch:
    inputs:
      force_morning_observe:
        description: "Run the moneyline odds refresh + profit recording even outside the morning Denver window"
        type: boolean
        default: false
      skip_morning_observe:
        description: "Skip the moneyline odds refresh + profit recording entirely"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scrape-promos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run scrape:promos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # quick-260928-kc5: optional -- absent means the pattern parsers only (no Claude Haiku promo reader this run).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Runs even when the scrape step above fails (a flaky or all-excluded
      # book must not block the odds refresh), but not when the run is
      # cancelled. --force is set for every scheduled run.
      - if: ${{ !cancelled() && github.event.inputs.skip_morning_observe != 'true' }}
        run: npm run odds:morning-observe -- ${{ (github.event_name == 'schedule' || github.event.inputs.force_morning_observe == 'true') && '--force' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
