# Scheduled + manual promo scraper (PROMO-03, D-07, D-08). Installs no
# browser -- all three target books are render_mode "http" (D-09), so the
# scrape step itself is a plain `npm ci` + one Node script writing straight
# to the shared Neon Postgres DB and spends zero Odds API credits. The
# second step (quick-260927-n12) spends ONE moneyline-only refresh, but
# only on the 8am Denver run (gated inside the script) -- the noon/5pm runs
# of this same schedule call it too and no-op.
#
# `timezone` (GitHub Changelog, 2026-03-19) lets a cron schedule name an IANA
# zone directly so 8am/noon/5pm Mountain Time stays correct across DST
# without a manual UTC-offset flip twice a year. If GitHub ever rejects this
# field on a workflow run, the fallback is a fixed UTC schedule tuned for MDT
# (UTC-6) -- `cron: "0 14,18,23 * * *"` -- which drifts about an hour during
# MST (Nov-Mar), an acceptable seasonal trade-off (03-RECON.md
# cron_hours_mountain).
name: Scrape promos

on:
  schedule:
    - cron: "0 8,12,17 * * *"
      timezone: "America/Denver"
  workflow_dispatch:
    inputs:
      force_morning_observe:
        description: "Force the moneyline odds refresh + profit-observation step, even outside the 8am Denver window"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scrape-promos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run scrape:promos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # quick-260927-n12 (owner scope change B): moneyline-only odds refresh
      # + profit-observation recording, gated to the 8am Denver run inside
      # the script itself (isMorningObservationWindow) -- the noon/5pm runs
      # of this same schedule call the script too, but it no-ops for them.
      # `--force` (workflow_dispatch input) bypasses the Denver-hour gate
      # for manual testing. Never the spreads/totals extended refresh here
      # (3x the credit cost would blow the 500-credit monthly budget).
      - run: npm run odds:morning-observe -- ${{ github.event.inputs.force_morning_observe == 'true' && '--force' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
