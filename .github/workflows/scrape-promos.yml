# Promo scraper + morning odds observe (PROMO-03, D-01, D-04, D-05, D-07, D-08).
#
# Primary trigger: a once-daily Vercel Cron (13:00-13:59 UTC) calls
# /api/cron/scrape, which dispatches this workflow with
# force_morning_observe=true. The single schedule below (15:37 UTC, about
# 9:37 AM MDT / 8:37 AM MST) is only a BACKUP: it skips the scrape when every
# targeted book already scraped OK earlier that Denver day, and skips the odds
# observe when a scheduled (no-user) refresh already ran that Denver day. The
# check reads scrape_runs / credit_usage and spends zero Odds API credits.
# Manual and Vercel-dispatched runs are never skipped. Manual dispatch is
# still available.
#
# 2026-10-06 (debug dk-mlb-choice-boost-missed): two afternoon promo-only
# passes (18:37 and 22:37 UTC, about 12:37 / 4:37 PM MDT) catch promos books
# post after the morning scrape -- a DraftKings "choice of 2 MLB games" 50%
# boost was missed for a whole day because it went up after 9:42 AM ET.
# These passes ALWAYS scrape (no already-ran-today skip) and NEVER run the
# odds observe step, so they spend zero Odds API credits.
#
# Installs no browser -- all target books are render_mode "http" (D-09), so
# the scrape step is a plain `npm ci` + one Node script writing straight to
# the shared Neon Postgres DB and spends zero Odds API credits.
#
# 2026-09-28: switched off the `timezone: "America/Denver"` key (GitHub
# Changelog 2026-03-19). With it, no scheduled run ever fired -- not at :00
# and not after moving to :07 -- only manual workflow_dispatch runs, matching
# community reports of the new key silently failing scheduler registration.
# Minute :37 (not :00) stays non-round: the top of the hour is the most heavily
# loaded, most often delayed/dropped scheduled slot.
name: Scrape promos

on:
  schedule:
    - cron: "37 15 * * *"
    - cron: "37 18 * * *"
    - cron: "37 22 * * *"
  workflow_dispatch:
    inputs:
      force_morning_observe:
        description: "Force the moneyline odds refresh + profit-observation step, even outside the morning Denver window (the Vercel cron dispatch sets this to true)"
        type: boolean
        default: false
      skip_morning_observe:
        description: "Skip the moneyline odds refresh + profit-observation step entirely (the Vercel cron dispatch sets this when today's morning refresh already ran, so a duplicate cron delivery never spends Odds API credits twice)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scrape-promos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - id: today
        name: Check whether today's morning run already happened
        if: github.event_name == 'schedule' && github.event.schedule == '37 15 * * *'
        timeout-minutes: 2
        run: npm run scrape:already-ran-today
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: ${{ github.event_name != 'schedule' || steps.today.outputs.scrape_done != 'true' }}
        run: npm run scrape:promos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # quick-260928-kc5: optional -- absent means the pattern parsers only (no Claude Haiku promo reader this run).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # quick-260927-n12: moneyline-only odds refresh + profit-observation
      # recording. `--force` (set by the Vercel cron dispatch, or manually)
      # bypasses the Denver-hour gate. On the scheduled backup run it is
      # skipped when a scheduled refresh already ran that Denver day. Never the
      # spreads/totals extended refresh here (3x the credit cost would blow the
      # 500-credit monthly budget).
      # quick-260927-ov2: runs even when the scrape step above fails (a
      # flaky/all-excluded book must not block the once-daily moneyline
      # refresh), but not when the run is cancelled.
      # Afternoon promo-only passes (any schedule other than the 15:37 backup)
      # never run this step.
      - if: ${{ !cancelled() && github.event.inputs.skip_morning_observe != 'true' && (github.event_name != 'schedule' || (github.event.schedule == '37 15 * * *' && steps.today.outputs.observe_done != 'true')) }}
        run: npm run odds:morning-observe -- ${{ github.event.inputs.force_morning_observe == 'true' && '--force' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
