# Promo scrape + odds refresh + profit recording, three standard runs a day
# (quick-261022-i3j): 7 AM, 12 PM and 5 PM Mountain Standard Time (8 AM,
# 1 PM, 6 PM during daylight time; cron times are fixed in UTC).
#
#   - 14:00 and 19:00 UTC: Vercel Cron calls /api/cron/scrape, which
#     dispatches this workflow with force_morning_observe=true (on time).
#   - 00:00 UTC: this workflow's own schedule below (GitHub can start
#     scheduled runs late, by up to a few hours).
#
# Every run scrapes promos, then runs one moneyline odds refresh and records
# profit snapshots (Statistics) and each member's own observations
# (member_profit_observations, the Dashboard). Scheduled and Vercel-triggered
# runs always pass --force so the Denver morning-window gate never skips them.
#
# Odds cost: each refresh spends about sports x region-groups x 1 credits (see
# src/ingestion/odds/quota.ts), three refreshes a day. The in-app credit guard
# blocks refreshes once the budget runs low.
#
# Manual dispatch is still available. force_morning_observe runs the odds step
# outside the morning window. skip_morning_observe skips the odds step.
#
# Installs no browser -- all target books are render_mode "http" (D-09), so
# the scrape step is a plain `npm ci` + one Node script writing straight to
# the shared Neon Postgres DB.
name: Scrape promos

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      force_morning_observe:
        description: "Run the moneyline odds refresh + profit recording even outside the morning Denver window"
        type: boolean
        default: false
      skip_morning_observe:
        description: "Skip the moneyline odds refresh + profit recording entirely"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: scrape-promos
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run scrape:promos
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # quick-260928-kc5: optional -- absent means the pattern parsers only (no Claude Haiku promo reader this run).
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      # Runs even when the scrape step above fails (a flaky or all-excluded
      # book must not block the odds refresh), but not when the run is
      # cancelled. --force is set for every scheduled run.
      - if: ${{ !cancelled() && github.event.inputs.skip_morning_observe != 'true' }}
        run: npm run odds:morning-observe -- ${{ (github.event_name == 'schedule' || github.event.inputs.force_morning_observe == 'true') && '--force' || '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          ODDS_API_KEYS: ${{ secrets.ODDS_API_KEYS }}
